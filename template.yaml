AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  cloud-resume-challenge

Globals:
  Function:
    Timeout: 3

Resources:
  # S3 bucket that stores the site content (no website hosting here; CloudFront serves it)
  MyWebsite:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: gooseboys-cloud-resume-challenge
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # NOTE: removed WebsiteConfiguration (served via CloudFront)

  # Bucket policy: allow ONLY CloudFront (via OAC) to read this bucket
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MyWebsite
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub "arn:aws:s3:::${MyWebsite}/*"
            Condition:
              StringEquals:
                # Ref on a Distribution returns the distribution ID; this ARN format is global for CF
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${MyDistribution}"
          # ListBucket is optional for basic site delivery, but including it is harmless and future-proof
          - Sid: AllowListForCF
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:ListBucket
            Resource: !Sub "arn:aws:s3:::${MyWebsite}"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${MyDistribution}"

  # Origin Access Control for CloudFront -> S3 signed requests
  MyWebsiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: my-site-oac
        Description: Access S3 via SigV4
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront distribution serving the site from the S3 REST endpoint (with OAC)
  MyDistribution:
    Type: "AWS::CloudFront::Distribution"
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Aliases:
          - marcushenry.ca
        ViewerCertificate:
          AcmCertificateArn: !Ref MyCertificate
          SslSupportMethod: sni-only
        Origins:
          - Id: s3-rest-origin
            DomainName: !Sub "${MyWebsite}.s3.amazonaws.com"   # REST endpoint, not s3-website-...
            S3OriginConfig: {}                                  # required empty block for S3 origin
            OriginAccessControlId: !Ref MyWebsiteOAC
        DefaultCacheBehavior:
          TargetOriginId: s3-rest-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
        # TTLs (optional): can keep 0s for dev, but typical sites use non-zero TTLs
        DefaultCacheBehavior:
          TargetOriginId: s3-rest-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false

  # Route 53 alias to CloudFront
  MyDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: Z0188629LIZ3QYKWOH6U # <-- ensure this is your actual Hosted Zone ID
      Name: marcushenry.ca               # <-- your domain
      Type: A
      AliasTarget:
        DNSName: !GetAtt MyDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront’s fixed hosted zone ID (global)

  # ACM cert (in us-east-1 for CloudFront)
  MyCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: marcushenry.ca
      ValidationMethod: DNS

  # DynamoDB table (unchanged)
  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: cloud-resume-challenge
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ID
          AttributeType: S
      KeySchema:
        - AttributeName: ID
          KeyType: HASH

  # Lambda/API (unchanged)
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello_world/
      Handler: app.lambda_handler
      Runtime: python3.13
      Environment:
        Variables:
          TABLE_NAME: !Ref DynamoDBTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DynamoDBTable
      Architectures:
        - x86_64
      Events:
        HelloWorld:
          Type: Api
          Properties:
            Path: /hello
            Method: get

Outputs:
  HelloWorldApi:
    Description: "API Gateway endpoint URL for Prod stage for Hello World function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/hello/"
  HelloWorldFunction:
    Description: "Hello World Lambda Function ARN"
    Value: !GetAtt HelloWorldFunction.Arn
  HelloWorldFunctionIamRole:
    Description: "Implicit IAM Role created for Hello World function"
    Value: !GetAtt HelloWorldFunctionRole.Arn

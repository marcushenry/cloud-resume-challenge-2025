name: SAM Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  SAM_STACK_NAME: ${{ secrets.SAM_STACK_NAME || 'sam-app' }}

jobs:
  tests:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install pytest boto3 "moto[boto3]"
          # install any Lambda requirements (optional)
          if [ -f hello_world/requirements.txt ]; then
            pip install -r hello_world/requirements.txt
          fi

      - name: Run unit tests
        run: pytest -q tests/unit




  deploy:
    needs: tests
    name: Deploy SAM application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build SAM application
        run: sam build

      - name: Deploy SAM application
        run: |
          sam deploy \
            --config-env ci \
            --stack-name "${SAM_STACK_NAME}" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --stack-name "${SAM_STACK_NAME}" \
            --no-fail-on-empty-changeset \
            --region "${AWS_REGION}"

      - name: Upload site to S3
        run: |
          aws s3 sync resume-site/ s3://gooseboys-cloud-resume-challenge --delete
 